name: Episodio diario

on:
  schedule:
    # 17:00 UTC = 18:00 en invierno / 19:00 en verano (hora de España).
    # GitHub puede retrasar unos minutos las ejecuciones programadas.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo generar el vídeo (no publicar)"
        type: boolean
        default: true
      new_story:
        description: "Empezar historia nueva (aunque quede una parte pendiente)"
        type: boolean
        default: false
      topic:
        description: "Tema de la historia nueva (vacío = lo propone Claude)"
        type: string
        default: ""
      format:
        description: "Formato de la historia nueva"
        type: choice
        options: [auto, punto_inflexion, crimen_historico]
        default: auto
      force:
        description: "Publicar aunque ya se haya publicado hoy"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg y librerías gráficas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1 fontconfig

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Generar y publicar
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ vars.UPLOAD_POST_USER }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TZ: Europe/Madrid
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
            if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
            if [ "${{ inputs.new_story }}" = "true" ]; then ARGS+=(--new); fi
            if [ "${{ inputs.format }}" != "auto" ]; then ARGS+=(--format "${{ inputs.format }}"); fi
            if [ -n "$TOPIC" ]; then ARGS+=(--topic "$TOPIC"); fi
          fi
          python -m reels "${ARGS[@]}"

      - name: Vista previa (fotogramas)
        if: always()
        run: |
          for f in out/*/reel.mp4; do
            [ -f "$f" ] || continue
            ffmpeg -loglevel error -y -i "$f" -vf "fps=1/5,scale=270:-1,tile=5x2" -frames:v 1 "$(dirname "$f")/preview.jpg" || true
          done

      - name: Guardar vídeo y guion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: |
            out/*/reel.mp4
            out/*/guion.md
            out/*/series.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Guardar vista previa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: |
            out/*/preview.jpg
            out/*/guion.md
          if-no-files-found: ignore

      - name: Guardar historial y partes pendientes
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || (git commit -m "Estado: episodio $(date +%F)" && git push)
