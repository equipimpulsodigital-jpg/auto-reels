name: Episodio diario

on:
  schedule:
    # Una ejecución por la noche prepara los vídeos de las próximas 24 h y los deja PROGRAMADOS en
    # Upload-Post a las horas exactas de config.yaml (publish.slots). Las demás son de reserva, por si
    # GitHub se salta o retrasa alguna (pasa a menudo): si ya está todo programado, acaban en segundos.
    - cron: "40 22 * * *"   # 23:40 / 00:40 en España
    - cron: "40 2 * * *"
    - cron: "40 5 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal"
        type: choice
        options: [todos, bien_contadas, elanecdotario]
        default: todos
      mode:
        description: "programar = deja programadas las franjas de 24 h · prueba = solo genera un vídeo · ahora = publica uno ya · estado = cómo acabaron las últimas publicaciones"
        type: choice
        options: [prueba, programar, ahora, estado]
        default: prueba
      new_story:
        description: "Empezar historia nueva (aunque quede una parte pendiente)"
        type: boolean
        default: false
      topic:
        description: "Tema de la historia nueva (vacío = lo propone Claude)"
        type: string
        default: ""
      format:
        description: "Formato de la historia nueva (vacío = alterna; ver formats en config.yaml)"
        type: string
        default: ""
      force:
        description: "Publicar aunque el canal esté en pausa"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ¿Hay algo que preparar?
        id: todo
        run: |
          pip install -q pyyaml
          if [ "${{ inputs.mode }}" = "estado" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python -m reels --check | tee pending.txt
          if awk '$2 > 0 {found=1} END {exit !found}' pending.txt; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "Todo programado: nada que hacer."; fi

      - name: Estado de las últimas publicaciones
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'estado'
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: |
          pip install -q requests pydantic anthropic
          C="${{ inputs.channel }}"; [ "$C" = "todos" ] && C=bien_contadas
          python -m reels --status --channel "$C"

      - name: Instalar FFmpeg y librerías gráficas
        if: steps.todo.outputs.go == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1 fontconfig

      - name: Instalar dependencias
        if: steps.todo.outputs.go == 'true'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Generar y publicar
        if: steps.todo.outputs.go == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TZ: Europe/Madrid
          FORMAT: ${{ inputs.format }}
        run: |
          ARGS=()
          CHANNELS=$(python -m reels --check | awk '$2 > 0 {print $1}')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNELS="${{ inputs.channel }}"
            [ "$CHANNELS" = "todos" ] && CHANNELS=$(python -m reels --check | awk '{print $1}')
            case "${{ inputs.mode }}" in
              prueba) ARGS+=(--dry-run) ;;
              ahora) ARGS+=(--now) ;;
            esac
            if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
            if [ "${{ inputs.new_story }}" = "true" ]; then ARGS+=(--new); fi
            if [ -n "$FORMAT" ]; then ARGS+=(--format "$FORMAT"); fi
            if [ -n "$TOPIC" ]; then ARGS+=(--topic "$TOPIC"); fi
          fi
          status=0
          for c in $CHANNELS; do
            python -m reels --channel "$c" "${ARGS[@]}" || status=1
          done
          exit $status

      - name: Vista previa (fotogramas)
        if: always() && steps.todo.outputs.go == 'true'
        run: |
          for f in out/*/reel.mp4; do
            [ -f "$f" ] || continue
            ffmpeg -loglevel error -y -i "$f" -vf "fps=1/5,scale=270:-1,tile=5x2" -frames:v 1 "$(dirname "$f")/preview.jpg" || true
          done

      - name: Guardar vídeo y guion
        if: always() && steps.todo.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: |
            out/*/reel.mp4
            out/*/guion.md
            out/*/series.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Guardar vista previa
        if: always() && steps.todo.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.run_id }}
          path: |
            out/*/preview.jpg
            out/*/guion.md
          if-no-files-found: ignore

      - name: Guardar historial y partes pendientes
        if: always() && steps.todo.outputs.go == 'true'
        run: |
          git config user.name "reels-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || (git commit -m "Estado: episodios $(date +%F)" && git pull --rebase && git push)
