name: Episodio diario

on:
  schedule:
    # 4:05 (España, invierno): prepara HOY y MAÑANA (44 h) y lo deja programado en Upload-Post. Así, si GitHub se
    # salta una ejecución (pasa), el día ya estaba cubierto desde la víspera. Es de madrugada para no chocar con
    # el límite de uso de Claude (ventanas de 5 h).
    - cron: "5 3 * * *"
    # Reservas: solo rellenan huecos de las 12 h siguientes (no gastan Claude si todo está programado).
    - cron: "40 6 * * *"
    - cron: "40 12 * * *"
    - cron: "40 17 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal"
        type: choice
        options: [todos, bien_contadas, elanecdotario, conexionconchispa, lacabezapordentro, ysiciencia]
        default: todos
      mode:
        description: "programar = deja programadas las franjas de 24 h · prueba = solo genera un vídeo · ahora = publica uno ya · estado = cómo acabaron las últimas publicaciones · estadisticas = visualizaciones de cada vídeo"
        type: choice
        options: [prueba, programar, ahora, estado, estadisticas, quitar_etiqueta, cuentas]
        default: prueba
      new_story:
        description: "Empezar historia nueva (aunque quede una parte pendiente)"
        type: boolean
        default: false
      topic:
        description: "Tema de la historia nueva (vacío = lo propone Claude)"
        type: string
        default: ""
      format:
        description: "Formato de la historia nueva (vacío = alterna; ver formats en config.yaml)"
        type: string
        default: ""
      force:
        description: "Publicar aunque el canal esté en pausa"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  reel:
    # Un trabajo por canal, en paralelo. Cada canal solo toca sus archivos de data/<canal>/.
    strategy:
      fail-fast: false
      matrix:
        channel: [bien_contadas, elanecdotario, conexionconchispa, lacabezapordentro, ysiciencia]
    concurrency:
      group: reel-${{ matrix.channel }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CH: ${{ matrix.channel }}
      HORIZON: ${{ github.event.schedule == '5 3 * * *' && '44' || '12' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ¿Hay algo que preparar?
        id: todo
        run: |
          pip install -q pyyaml
          want="${{ inputs.channel }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$want" != "todos" ] && [ "$want" != "$CH" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Este canal no se ha elegido."; exit 0
          fi
          if [ "${{ inputs.mode }}" = "estado" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "status=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ inputs.mode }}" = "estadisticas" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "stats=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ inputs.mode }}" = "cuentas" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "accounts=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ inputs.mode }}" = "quitar_etiqueta" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "unlabel=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          line=$(python -m reels --check --horizon "$HORIZON" | awk -v c="$CH" '$1 == c')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # «prueba» funciona aunque el canal esté en pausa; el resto necesita el canal activo (o «force»)
            if [ -n "$line" ] || [ "${{ inputs.mode }}" = "prueba" ] || [ "${{ inputs.force }}" = "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
            else echo "go=false" >> "$GITHUB_OUTPUT"; echo "Canal en pausa."; fi
            exit 0
          fi
          echo "${line:-$CH en pausa}"
          if [ -n "$line" ] && [ "$(echo "$line" | awk '{print $2}')" -gt 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "Nada que preparar."; fi

      - name: Estado de las últimas publicaciones
        if: steps.todo.outputs.status == 'true'
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: |
          pip install -q requests
          python -m reels --status --channel "$CH"

      - name: Visualizaciones de cada vídeo
        if: steps.todo.outputs.stats == 'true'
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: |
          pip install -q requests
          python -m reels --stats --channel "$CH"

      - name: Quitar la etiqueta de IA de lo ya programado
        if: steps.todo.outputs.unlabel == 'true'
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: |
          pip install -q requests
          python -m reels --unlabel --channel "$CH"

      - name: Cuentas conectadas
        if: steps.todo.outputs.accounts == 'true'
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: |
          pip install -q requests
          python -m reels --accounts --channel "$CH"

      - name: Instalar FFmpeg y librerías gráficas
        if: steps.todo.outputs.go == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1 fontconfig

      - name: Instalar dependencias
        if: steps.todo.outputs.go == 'true'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Generar y publicar
        if: steps.todo.outputs.go == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          FORMAT: ${{ inputs.format }}
          TZ: Europe/Madrid
        run: |
          ARGS=(--horizon "$HORIZON")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS=(--horizon 24)
            case "${{ inputs.mode }}" in
              prueba) ARGS+=(--dry-run) ;;
              ahora) ARGS+=(--now) ;;
            esac
            if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
            if [ "${{ inputs.new_story }}" = "true" ]; then ARGS+=(--new); fi
            if [ -n "$FORMAT" ]; then ARGS+=(--format "$FORMAT"); fi
            if [ -n "$TOPIC" ]; then ARGS+=(--topic "$TOPIC"); fi
          fi
          # antes de escribir la historia de cada noche, se miran las visualizaciones (el guionista aprende de ellas)
          if [ "${{ github.event.schedule }}" = "5 3 * * *" ]; then python -m reels --stats --channel "$CH" || true; fi
          python -m reels --channel "$CH" "${ARGS[@]}"

      - name: Vista previa (fotogramas)
        if: always() && steps.todo.outputs.go == 'true'
        run: |
          for f in out/*/reel.mp4; do
            [ -f "$f" ] || continue
            ffmpeg -loglevel error -y -i "$f" -vf "fps=1/5,scale=270:-1,tile=5x2" -frames:v 1 "$(dirname "$f")/preview.jpg" || true
          done

      - name: Guardar vídeo y guion
        if: always() && steps.todo.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ matrix.channel }}-${{ github.run_id }}
          path: |
            out/*/reel.mp4
            out/*/guion.md
            out/*/series.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Guardar vista previa
        if: always() && steps.todo.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.channel }}-${{ github.run_id }}
          path: |
            out/*/preview.jpg
            out/*/guion.md
          if-no-files-found: ignore

      - name: Guardar historial y partes pendientes
        if: always() && (steps.todo.outputs.go == 'true' || steps.todo.outputs.stats == 'true')
        run: |
          git config user.name "reels-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/$CH" "docs/$CH" || true
          git diff --cached --quiet && exit 0
          git commit -m "Estado $CH: $(date +%F)"
          # Otros canales pueden haber guardado a la vez: reintenta integrando sus cambios
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 7))
          done
          exit 1
