      instagram: https://www.instagram.com/lacabezapordentro/
      tiktok: https://www.tiktok.com/@lacabezapordentro
    style: caricatura             # caricaturas de los políticos y famosos de la noticia
    interest_queries: ["elecciones generales 29N", "campaña electoral", "encuesta elecciones", "debate electoral", "candidatos propuestas vivienda impuestos", "famosos polémica", "famosos ruptura", "viral redes sociales polémica", "cantante comentario viral"]
    news_days: 2                      # solo noticias de las últimas 48 horas
    max_horizon_hours: 26             # se programa solo hasta el día siguiente, para que el tema no caduque
    claude_tools: [WebSearch, WebFetch]   # el guionista comprueba los hechos en internet antes de escribir
