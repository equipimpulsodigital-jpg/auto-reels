    interest_queries: ["polémica citas pareja", "infidelidad estudio", "relaciones abiertas", "apps de citas tendencia"]   # noticias de la semana para inspirar temas
    slots: ["09:30", "11:45", "14:00", "16:00", "18:00", "20:00", "21:45"]   # la marca que mejor funciona: 7 vídeos al día
    format_cycle: [error_comun, antes_despues, red_flag, senales, debate, error_comun, antes_despues, red_flag, senales, psicologia_atraccion]   # 27/11: error común, red flag y señales, los que más se ven; psicología de la atracción, la que menos
    host:                             # presentadora fija: cierra cada vídeo mirando a cámara
      name: Chispa
      location: cafeteria
      mood: atardecer
      look: {female: true, age: joven, skin: media, hair_color: pelirrojo, hair_style: largo, outfit: camisa, outfit_color: rojo, accent_color: dorado, nose: pequeña, jaw: fina, eyes: verdes}
    formats:
