    host:                             # presentadora fija (de informativos): cierra cada vídeo mirando a cámara
      name: La Presentadora
      location: plato_debate
      mood: noche
      look: {female: true, age: adulto, skin: clara, hair_color: castaño, hair_style: moño, glasses: true, outfit: traje, outfit_color: azul_marino, accent_color: crema, nose: pequeña, jaw: fina, eyes: azules}
