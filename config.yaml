      campana_hoy: "Campaña hoy: la noticia política del día (elecciones 29-N) en 30 segundos: qué ha pasado, por qué importa y qué viene ahora. Neutral."
      dicho_vs_dato: "Dicho vs dato: una frase de campaña o una idea muy repetida, comparada con los datos oficiales (con fuente)."
      cotilleo: "El cotilleo del día: lo que ha pasado con un famoso que es noticia hoy, con lo que se sabe y lo que no, atribuido a sus fuentes."
      polemica_redes: "La polémica de las redes: el tema viral de hoy del que todo el mundo opina, y los dos bandos."

