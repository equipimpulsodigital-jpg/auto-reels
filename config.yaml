# Configuración del canal. Puedes editar este archivo sin tocar el código.
# Las reglas creativas del guionista están en prompts/guionista.md.

series:
  max_parts: 2                # cada historia se cuenta en 1 o 2 partes (una parte por día)

video:
  width: 1080
  height: 1920
  fps: 30
  music_volume: 0.35          # música de fondo (0-1); baja sola cuando habla el narrador
  progress_bar: true          # barra fina de progreso abajo, del color de la marca

animation:
  # Caricaturas animadas por código (reels/toon): escenarios, vestuario, objetos y sucesos.
  # El guionista elige de la biblioteca; ver reels/toon/catalog.py.
  caption_y: 0.86            # altura de los subtítulos (fracción de la pantalla)

voice:
  provider: edge              # edge (gratis) | elevenlabs (más natural, de pago)
  edge_voice: es-ES-AlvaroNeural   # narrador
  edge_rate: "+18%"
  edge_pitch: "-4Hz"          # un poco más grave, tono de narrador
  # Reparto: voces de los personajes que hablan (Claude elige una para cada personaje).
  # Las «Multilingual» hablan español con el acento de su país.
  cast:
    hombre_mayor: {voice: es-ES-AlvaroNeural, rate: "+4%", pitch: "-18Hz"}
    hombre_joven: {voice: es-ES-AlvaroNeural, rate: "+16%", pitch: "+12Hz"}
    mujer:        {voice: es-ES-ElviraNeural, rate: "+10%", pitch: "-2Hz"}
    mujer_joven:  {voice: es-ES-XimenaNeural, rate: "+12%", pitch: "+0Hz"}
    americano:    {voice: en-US-AndrewMultilingualNeural, rate: "+8%", pitch: "-2Hz"}
    americana:    {voice: en-US-AvaMultilingualNeural, rate: "+8%", pitch: "+0Hz"}
    frances:      {voice: fr-FR-RemyMultilingualNeural, rate: "+8%", pitch: "+0Hz"}
    italiano:     {voice: it-IT-GiuseppeMultilingualNeural, rate: "+8%", pitch: "+0Hz"}
    ingles:       {voice: en-AU-WilliamMultilingualNeural, rate: "+8%", pitch: "+0Hz"}
    latino:       {voice: es-MX-JorgeNeural, rate: "+10%", pitch: "+0Hz"}
  elevenlabs_voice_id: ""
  elevenlabs_model: eleven_multilingual_v2

claude:
  # auto: usa Claude Code con tu suscripción si existe CLAUDE_CODE_OAUTH_TOKEN; si no, la API.
  backend: auto               # auto | claude-code | api
  model: claude-opus-5-5
  effort: medium              # medio: buen equilibrio entre calidad y uso de la suscripción (high = más rigor, más uso)

publish:
  # Horas de publicación (hora de España). Una ejecución diaria de GitHub prepara los vídeos
  # y los deja PROGRAMADOS en Upload-Post a estas horas exactas (aunque GitHub llegue tarde).
  timezone: Europe/Madrid
  slots: ["10:00", "13:00", "16:00", "19:00", "22:00"]
  min_lead_minutes: 20        # no programa una franja que empiece antes de este margen
  min_gap_minutes: 100        # ni una franja a menos de este tiempo de otra ya programada
  label_as_ai: false          # etiqueta «hecho con IA» de cada red (no hace falta para animación)
  youtube_privacy: public     # public | unlisted | private
  youtube_thumbnail: true     # portada propia también en YouTube (los 5 canales están verificados)

# Recopilación semanal para YouTube: un vídeo largo con las historias completas de la semana.
compilation:
  enabled: true
  weekday: 6                  # 0 = lunes ... 6 = domingo
  time: "11:00"
  min_stories: 3              # si hay menos historias completas, esa semana no se hace
  max_minutes: 20

# Amazon Afiliados: enlaces a libros en las recopilaciones de YouTube (un canal puede usar su propio
# `affiliate_tag`). La frase es obligatoria donde haya enlaces de afiliado.
affiliate:
  tag: historiasbien-21
  mention_every: 3            # «el libro, en el enlace de mi perfil» solo en 1 de cada 3 historias (0 = nunca)
  disclosure: "Como afiliado de Amazon, obtengo ingresos por las compras adscritas que cumplen los requisitos aplicables."

# Canales: cada uno es un perfil de Upload-Post con su temática, su guionista y su historial.
channels:
  bien_contadas:
    name: Bien Contadas
    enabled: true             # false = no genera ni publica nada
    profile: bien_contadas    # nombre exacto del perfil en Upload-Post
    platforms: [instagram, youtube, tiktok]
    prompt: prompts/bien_contadas.md
    accent_color: "#E2A84B"
    compilation_titles:
      - "{n} historias oscuras de España que no te contaron en el colegio"
      - "{n} momentos en que España estuvo a punto de cambiar para siempre"
      - "Historia oscura de España: {n} casos reales, de principio a fin"
    compilation_thumb: "{n} historias que no te contaron"
    compilation_tags: [historiadeespaña, historia, españa, crimenesreales, recopilacion]
    hashtag: "#biencontadas"           # hashtag propio de la marca, en todos sus vídeos
    narrator: {voice: es-ES-AlvaroNeural, rate: "+18%", pitch: "-4Hz"}   # voz del narrador de la marca
    music: [epica, intriga, conspiracion, batalla, misterio, suspense]
    end_card: "Sígueme para más historias"
    tagline: "Historias reales de España, contadas en dibujos."
    links:                    # para la página de enlaces (actualiza los @ si cambian)
      youtube: https://www.youtube.com/@historiasbiencontadass
      instagram: https://www.instagram.com/bien_contadas/
      tiktok: https://www.tiktok.com/@historias.bien.co86
    interest_queries: ["historia de España", "hallazgo arqueológico España", "crimen histórico", "serie basada en hechos reales"]   # noticias de la semana para inspirar temas
    formats:
      punto_inflexion: "Punto de inflexión («El día que España estuvo a punto de...»)"
      crimen_historico: "Crimen, conspiración o suceso oscuro real de la historia de España"
      personaje_olvidado: "Personaje olvidado: una persona real de la historia de España que hizo algo increíble y casi nadie conoce"
      error_historico: "El error que lo cambió todo: una equivocación, malentendido o casualidad real con consecuencias enormes"
