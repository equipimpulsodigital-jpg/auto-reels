      red_flag: "¿Red flag o green flag?: una conducta concreta en una cita o una relación y qué dice de esa persona"
      antes_despues: "Antes y después: la misma situación mal y bien, con un truco concreto para ligar o conectar"
      psicologia_atraccion: "Lo que dice la psicología sobre atracción, conversación o confianza, con un consejo práctico"
      error_comun: "El error que casi todos cometen al ligar, en una cita o por mensaje, y la frase o gesto concreto que lo arregla"
      senales: "Señales: cómo saber si le gustas (o no) por lo que hace, con una situación real y qué hacer en cada caso"
