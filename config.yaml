    end_card: "Un truco para ligar cada día · Sígueme"
    tagline: "Trucos para romper el hielo y conectar con la gente."
    links:                    # para la página de enlaces (actualiza los @ si cambian)
      youtube: https://www.youtube.com/@conexionconchispa
      instagram: https://www.instagram.com/conexionconchispa/
      tiktok: https://www.tiktok.com/@conexionconchispa
