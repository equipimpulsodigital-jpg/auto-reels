# Configuración del canal. Puedes editar este archivo sin tocar el código.
# Las reglas creativas del guionista están en prompts/guionista.md.

series:
  max_parts: 2                # cada historia se cuenta en 1 o 2 partes (una parte por día)

video:
  width: 1080
  height: 1920
  fps: 30
  music_volume: 0.35          # música de fondo (0-1); baja sola cuando habla el narrador

animation:
  # Caricaturas animadas por código (reels/toon): escenarios, vestuario, objetos y sucesos.
  # El guionista elige de la biblioteca; ver reels/toon/catalog.py.
  caption_y: 0.86            # altura de los subtítulos (fracción de la pantalla)

voice:
  provider: edge              # edge (gratis) | elevenlabs (más natural, de pago)
  edge_voice: es-ES-AlvaroNeural   # narrador
  edge_rate: "+14%"
  edge_pitch: "-4Hz"          # un poco más grave, tono de narrador
  # Reparto: voces de los personajes que hablan (Claude elige una para cada personaje).
  # Las «Multilingual» hablan español con el acento de su país.
  cast:
    hombre_mayor: {voice: es-ES-AlvaroNeural, rate: "+4%", pitch: "-18Hz"}
    hombre_joven: {voice: es-ES-AlvaroNeural, rate: "+16%", pitch: "+12Hz"}
    mujer:        {voice: es-ES-ElviraNeural, rate: "+10%", pitch: "-2Hz"}
    mujer_joven:  {voice: es-ES-XimenaNeural, rate: "+12%", pitch: "+0Hz"}
    americano:    {voice: en-US-AndrewMultilingualNeural, rate: "+8%", pitch: "-2Hz"}
    americana:    {voice: en-US-AvaMultilingualNeural, rate: "+8%", pitch: "+0Hz"}
    frances:      {voice: fr-FR-RemyMultilingualNeural, rate: "+8%", pitch: "+0Hz"}
    italiano:     {voice: it-IT-GiuseppeMultilingualNeural, rate: "+8%", pitch: "+0Hz"}
    ingles:       {voice: en-AU-WilliamMultilingualNeural, rate: "+8%", pitch: "+0Hz"}
    latino:       {voice: es-MX-JorgeNeural, rate: "+10%", pitch: "+0Hz"}
  elevenlabs_voice_id: ""
  elevenlabs_model: eleven_multilingual_v2

claude:
  # auto: usa Claude Code con tu suscripción si existe CLAUDE_CODE_OAUTH_TOKEN; si no, la API.
  backend: auto               # auto | claude-code | api
  model: claude-opus-5-5
  effort: high                # alto: prioriza la fidelidad histórica

publish:
  # Horas de publicación (hora de España). Una ejecución diaria de GitHub prepara los vídeos
  # y los deja PROGRAMADOS en Upload-Post a estas horas exactas (aunque GitHub llegue tarde).
  timezone: Europe/Madrid
  slots: ["10:00", "13:00", "16:00", "19:00", "22:00"]
  min_lead_minutes: 20        # no programa una franja que empiece antes de este margen
  label_as_ai: true           # obligatorio en la práctica: la animación está hecha por ordenador
  youtube_privacy: public     # public | unlisted | private

# Canales: cada uno es un perfil de Upload-Post con su temática, su guionista y su historial.
channels:
  bien_contadas:
    name: Historia oscura de España
    enabled: true             # false = no genera ni publica nada
    profile: bien_contadas    # nombre exacto del perfil en Upload-Post
    platforms: [instagram, youtube]   # añade tiktok cuando esté conectado en Upload-Post
    prompt: prompts/bien_contadas.md
    accent_color: "#E2A84B"
    formats:
      punto_inflexion: "Punto de inflexión («El día que España estuvo a punto de...»)"
      crimen_historico: "Crimen, conspiración o suceso oscuro real de la historia de España"
  elanecdotario:
    name: Historias de misterio
    enabled: false            # EN PAUSA: se está preparando el perfil (nombre, imagen, descripciones)
    profile: elanecdotario
    platforms: [youtube]      # añade instagram cuando esté conectado en Upload-Post
    prompt: prompts/elanecdotario.md
    accent_color: "#7FD1C7"
    formats:
      caso_sin_resolver: "Caso sin resolver (desaparición, muerte extraña o crimen nunca aclarado)"
      enigma: "Enigma o suceso inexplicable (lugar, objeto, barco, expedición o fenómeno real)"
